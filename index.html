<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SG引领 · BI 看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a1628,#1e3a5f 55%,#0a1628);font-family:'Noto Sans SC',-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
.card{width:380px;max-width:92vw;background:#fff;border-radius:20px;padding:40px 36px;box-shadow:0 30px 90px rgba(10,22,40,.5);text-align:center}
.card h1{font-size:22px;font-weight:700;color:#152237;margin-bottom:6px}
.card .sub{color:#94a3b8;font-size:13px;margin-bottom:28px}
.field{margin-bottom:16px;text-align:left}
.field label{display:block;font-size:12px;color:#5b6b85;margin-bottom:7px;font-weight:500}
.field input{width:100%;background:#f6f8fc;border:1px solid #e3e8f0;border-radius:10px;padding:13px 14px;font-size:15px;color:#152237;transition:all .2s}
.field input:focus{outline:none;border-color:#5083fb;box-shadow:0 0 0 3px rgba(80,131,251,.14);background:#fff}
.btn{width:100%;margin-top:10px;background:linear-gradient(135deg,#1e3a5f,#5083fb);border:none;border-radius:10px;padding:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:3px;transition:filter .2s}
.btn:hover{filter:brightness(1.1)}
.err{color:#ef4444;font-size:12.5px;margin-top:14px;min-height:16px}
.foot{margin-top:26px;color:#b8c5d8;font-size:11px}
.logo{font-size:36px;margin-bottom:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📊</div>
  <h1>SG引领 · BI 看板</h1>
  <div class="sub">数据看板受密码保护，请验证后访问</div>
  <div class="field">
    <label>访问密码</label>
    <input id="pw" type="password" placeholder="请输入密码" autofocus>
  </div>
  <button class="btn" onclick="check()">进 入</button>
  <div class="err" id="err"></div>
  <div class="foot">© 2026 新加坡引领 · 数据受保护</div>
</div>
<script>
var _k=[121,105,110,108,105,110,103];
var _p=_k.map(function(c){return String.fromCharCode(c);}).join('');
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')check();});
function check(){
  var v=document.getElementById('pw').value.trim();
  if(v===_p){window.location.href='index-dashboard.html';}
  else{document.getElementById('err').textContent='密码错误，请重试';document.getElementById('pw').value='';document.getElementById('pw').focus();}
}
</script>
</body>
</html>
