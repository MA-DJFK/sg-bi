<style>
:root{--bg:#f2f4f8;--surface:#fff;--border:#e3e8f0;--border-light:#eef1f6;--text:#152237;--text2:#5b6b85;--muted:#94a3b8;--primary:#5083fb;--navy:#1e3a5f;--success:#12b886;--error:#ef4444;--warning:#f59e0b;--gold:#d4a017;--accent:#8b5cf6;--info:#06b6d4;--font:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Roboto,sans-serif;--mono:'DIN','SF Mono',Consolas,var(--font);--radius:12px;--shadow:0 1px 3px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.05);}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}
.rate-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(18,184,134,.16);border:1px solid rgba(18,184,134,.4);color:#4ade80;padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap}.rate-badge i{font-size:13px}
#login{display:none !important;position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a1628,#1e3a5f 55%,#0a1628)}
.login-card{width:390px;max-width:92vw;background:#fff;border-radius:20px;padding:40px 36px;box-shadow:0 30px 90px rgba(10,22,40,.5);animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand .lg{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0a1628,#1e3a5f);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.brand h1{font-size:18px;font-weight:700;color:#152237}
.login-sub{color:var(--muted);font-size:13px;margin-bottom:26px}
.field{margin-bottom:16px}.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:7px}
.field input{width:100%;background:#f6f8fc;border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;font-family:var(--font)}
.field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(80,131,251,.14);background:#fff}
.login-btn{width:100%;margin-top:8px;background:linear-gradient(135deg,#1e3a5f,#5083fb);border:none;border-radius:10px;padding:13px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:3px}
.login-btn:hover{filter:brightness(1.07)}
.login-err{color:var(--error);font-size:12.5px;margin-top:14px;min-height:16px;text-align:center}
.login-foot{margin-top:22px;text-align:center;color:var(--muted);font-size:11px}
#app{display:block}
.hero{background:linear-gradient(100deg,#0a1628 0%,#1e3a5f 50%,#0a1628 100%);color:#fff;padding:26px 0}
.hero-in{max-width:1320px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.hero .h-left{display:flex;align-items:center;gap:14px}
.hero .logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid rgba(255,255,255,.18)}
.hero h1{font-size:21px;font-weight:700;letter-spacing:.5px}
.hero .h-sub{font-size:13px;color:rgba(255,255,255,.72);margin-top:5px}
.hero .h-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cur-seg{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:3px}
.cur-seg button{background:none;border:none;color:rgba(255,255,255,.7);padding:7px 15px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.cur-seg button.active{background:#fff;color:#1e3a5f}
.h-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;padding:8px 15px;border-radius:9px;cursor:pointer;font-size:13px}
.h-btn:hover{background:rgba(255,255,255,.22)}
.wrap{max-width:1320px;margin:0 auto;padding:24px 28px 60px}
.vtabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.vtab{background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 18px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text2);box-shadow:var(--shadow)}
.vtab:hover{color:var(--primary)}
.vtab.active{background:linear-gradient(135deg,#1e3a5f,#5083fb);color:#fff;border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.kpis{grid-template-columns:1fr}}
.kpi{background:#fff;border-radius:var(--radius);padding:20px 22px;position:relative;box-shadow:var(--shadow);border-left:4px solid var(--c,#5083fb);overflow:hidden}
.kpi .badge{position:absolute;right:18px;top:18px;width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--bbg,#eef4ff);color:var(--c,#5083fb)}
.kpi .k-label{font-size:13px;color:var(--text2);font-weight:500}
.kpi .k-val{font-size:30px;font-weight:800;color:var(--c,#5083fb);margin-top:8px;font-family:var(--mono);letter-spacing:-.5px;line-height:1}
.kpi .k-val .unit{font-size:14px;font-weight:600;color:var(--text2);margin-left:3px}
.kpi .k-sub{font-size:12px;color:var(--muted);margin-top:9px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.card{background:#fff;border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:8px;color:#152237}
.card h3 i{color:var(--primary);font-size:14px}
.card h3.between{justify-content:space-between}
.card .desc{font-size:12px;color:var(--muted);margin-bottom:13px}
.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-7{grid-column:span 7}.col-6{grid-column:span 6}.col-5{grid-column:span 5}.col-4{grid-column:span 4}
@media(max-width:900px){.col-8,.col-7,.col-6,.col-5,.col-4{grid-column:span 12}}
.chart{width:100%;height:330px}.chart-lg{width:100%;height:370px}
.seg{display:flex;gap:4px;background:#f1f5f9;border-radius:8px;padding:3px}
.seg button{background:none;border:none;color:var(--text2);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500}
.seg button.active{background:#5083fb;color:#fff}
.insights{display:flex;flex-direction:column;gap:12px}
.ins-item{border-radius:10px;padding:13px 15px;font-size:12.5px;line-height:1.6}
.ins-item .it{font-weight:700;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.ins-item.up{background:#e9f9f2;border:1px solid #b8ecd8}.ins-item.up .it{color:#0f9d6e}
.ins-item.down{background:#fdeeee;border:1px solid #f6cfcf}.ins-item.down .it{color:#dc3545}
.ins-item.info{background:#eef4ff;border:1px solid #cfe0ff}.ins-item.info .it{color:#2f6bde}
.wchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.wchip{background:#f6f8fc;border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:11px;color:var(--text2);text-align:center}
.wchip b{display:block;color:#152237;font-size:13px;font-family:var(--mono);margin-top:2px}
.tbl-wrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{text-align:right;color:var(--muted);font-weight:600;padding:10px 13px;border-bottom:2px solid var(--border);font-size:11.5px;background:#f8fafc;white-space:nowrap}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt td{padding:10px 13px;border-bottom:1px solid var(--border-light);font-family:var(--mono);text-align:right;color:#334155;white-space:nowrap}
table.dt tr:hover td{background:#f8fafc}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600;font-family:var(--font)}
.tag.air{background:#fdf6e3;color:#b8860b}.tag.route{background:#f3ecff;color:#7c3aed}.tag.chan{background:#eef4ff;color:#2f6bde}
.rate{font-weight:700;font-family:var(--font)}.rate.a{color:#12b886}.rate.b{color:#5083fb}.rate.c{color:#f59e0b}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.acts{grid-template-columns:1fr}}
.acol h4{font-size:13px;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.pbadge{width:22px;height:22px;border-radius:6px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.p0 .pbadge{background:#ef4444}.p1 .pbadge{background:#f59e0b}.p2 .pbadge{background:#5083fb}
.acard{border-radius:10px;padding:14px 15px;margin-bottom:11px;border:1px solid var(--border)}
.p0 .acard{background:#fdf0f0;border-color:#f8d7d7}.p1 .acard{background:#fdf8ed;border-color:#f6e6c0}.p2 .acard{background:#eff4ff;border-color:#d5e3ff}
.acard .at{font-weight:700;font-size:13px;color:#152237;margin-bottom:5px}
.acard .ad{font-size:12px;color:var(--text2);line-height:1.6}
.acard .ae{font-size:11.5px;color:#0f9d6e;margin-top:7px;font-weight:600;display:flex;align-items:center;gap:5px}
.footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:30px;line-height:1.7}
.tt-card{background:#fff;border-radius:13px;box-shadow:0 12px 40px rgba(15,23,42,.18);padding:14px 16px;min-width:200px;border:1px solid #eef1f6;font-family:var(--font)}
.tt-title{font-size:14px;font-weight:700;color:#152237;margin-bottom:10px}
.tt-row{display:flex;align-items:center;gap:9px;padding:4px 0}
.tt-dot{width:9px;height:9px;border-radius:50%}
.tt-name{font-size:12.5px;color:#5b6b85}
.tt-val{margin-left:auto;font-size:14px;font-weight:700;color:#152237;font-family:var(--mono)}
.maintabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px}
.maintab{padding:12px 26px;cursor:pointer;font-size:15px;font-weight:700;color:var(--text2);border-bottom:3px solid transparent;margin-bottom:-2px;transition:.15s}
.maintab:hover{color:var(--primary)}
.maintab.active{color:var(--primary);border-bottom-color:var(--primary)}
.mainpage{display:none}.mainpage.active{display:block}
.sqframe{width:100%;height:1600px;border:none;border-radius:12px;background:#fff}
.route-tip{position:fixed;z-index:999;background:#fff;border:1px solid #e3e8f0;border-radius:10px;box-shadow:0 8px 28px rgba(15,23,42,.16);padding:10px 14px;font-size:12.5px;color:#152237;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;font-family:var(--font)}
.route-tip.show{opacity:1}
.route-tip .tip-label{font-size:11px;color:#94a3b8;margin-bottom:3px}
.route-tip .tip-air{font-weight:700;font-size:14px;color:#5083fb;display:flex;align-items:center;gap:6px}
.route-tip .tip-air i{font-size:12px}
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="brand"><div class="lg"><span style="font-size:inherit">✈️</span></div><h1 id="loginTitle">新加坡引领 BI 看板</h1></div>
    <div class="login-sub" id="loginSub">机票批发业务数据分析平台 · 请登录后查看</div>
    <div class="field"><label id="lblUser">账号</label><input id="u" type="text" autocomplete="off"></div>
    <div class="field"><label id="lblPwd">密码</label><input id="p" type="password" autocomplete="off"></div>
    <button class="login-btn" id="loginBtn">登 录</button>
    <div class="login-err" id="err"></div>
    <div class="login-foot" id="loginFoot">© 新加坡引领 · 数据受保护，仅限授权人员访问</div>
  </div>
</div>
<div id="app">
  <div class="hero"><div class="hero-in">
    <div class="h-left"><div class="logo"><span style="font-size:inherit">✈️</span></div>
      <div><h1 id="heroTitle"></h1><div class="h-sub" id="heroSub"></div></div></div>
    <div class="h-right">
      <span class="rate-badge" id="rateBadge"></span>
      <div class="cur-seg" id="curSeg"><button data-cur="CNY" class="active">CNY 中文</button><button data-cur="SGD">SGD EN</button></div>
      <button class="h-btn" id="printBtn"></button>
      
    </div>
  </div></div>
  <div class="wrap">
    <div class="maintabs">
      <div class="maintab active" data-mt="biz"><span style="font-size:inherit">📈</span> 月度经营看板</div>
      <div class="maintab" data-mt="sqkpi"><span style="font-size:inherit">⚡</span> SQ 后返 KPI</div>
      <div class="maintab" data-mt="tkkpi"><span style="font-size:inherit">✈️</span> TK 后返 KPI</div>
      <div class="maintab" data-mt="nxkpi"><span style="font-size:inherit">✈️</span> NX 后返 KPI</div>
    </div>
    <div class="mainpage active" id="mp-biz">
    <div class="vtabs" id="vtabs">
      <div class="vtab active" data-v="all"></div><div class="vtab" data-v="supply"></div>
      <div class="vtab" data-v="market"></div><div class="vtab" data-v="ops"></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid" id="grid">
      <div class="card col-8"><h3 class="between"><span><span style="font-size:inherit">📊</span> <span id="t-weekly"></span></span><span style="font-size:11.5px;color:#94a3b8" id="wkTip"></span></h3><div class="desc" id="d-weekly"></div><div id="c-weekly" class="chart"></div></div>
      <div class="card col-4"><h3><span>•</span> <span id="t-supplier"></span></h3><div class="desc" id="d-supplier"></div><div id="c-supplier" class="chart"></div></div>
      <div class="card col-5"><h3><span>•</span> <span id="t-seg"></span></h3><div class="desc" id="d-seg"></div><div id="c-seg" class="chart"></div></div>

      <div class="card col-5"><h3><span>•</span> <span id="t-ins"></span></h3><div class="desc" id="d-ins"></div><div class="insights" id="wkInsights"></div></div>

function tryLogin(){var u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;if(u===CRED.u&&p===CRED.p){try{sessionStorage.setItem(LKEY,'1')}catch(e){}showApp();}else{document.getElementById('err').textContent=tr().errMsg;document.getElementById('p').value='';}}
document.getElementById('loginBtn').addEventListener('click',tryLogin);
['u','p'].forEach(function(id){document.getElementById(id).addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});});

var D=window.SG, CUR='CNY';
function sym(){return CUR==='CNY'?'\u00a5':'S$';}
function _nf(n,d){if(typeof Highcharts!=='undefined'&&Highcharts.numberFormat)return Highcharts.numberFormat(n,d,'.',',');var x=Number(n)||0;return x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmt(n){return _nf(n,0);}
function fmt1(n){return _nf(n,1);}
function fmt2(n){return _nf(n,2);}
// 双币种直接取值：CNY取base字段，SGD取 base+'_sgd' 字段（真实值，零往返换算）
function V(o,base){return CUR==='SGD'?(o[base+'_sgd']):(o[base]);}
function moneyV(v){return sym()+fmt2(v);}
function moneyWV(v){return fmt2(v/10000)+(L==='zh'?'\u4e07':'0k');}
// KPI等标量：传对象+基名
function money(o,base){return moneyV(V(o,base));}
function moneyW(o,base){return moneyWV(V(o,base));}
function nm(o){return (L==='en'&&o.name_en)?o.name_en:o.name;}
function HAS_BUBBLE(){return !!(typeof Highcharts!=='undefined'&&Highcharts.seriesTypes&&Highcharts.seriesTypes.bubble);}
var base={chart:{backgroundColor:'transparent',style:{fontFamily:getComputedStyle(document.documentElement).getPropertyValue('--font')}},title:{text:null},credits:{enabled:false},accessibility:{enabled:true},legend:{itemStyle:{color:'#5b6b85',fontWeight:'600'}},xAxis:{labels:{style:{color:'#5b6b85'}},lineColor:'#e3e8f0',tickColor:'#e3e8f0',gridLineColor:'#eef1f6'},yAxis:{labels:{style:{color:'#94a3b8'}},gridLineColor:'#eef1f6',title:{style:{color:'#94a3b8'}}},tooltip:{backgroundColor:'#fff',borderColor:'#e3e8f0',style:{color:'#152237'},shadow:true}};
var NAVY={linearGradient:{x1:0,x2:0,y1:0,y2:1},stops:[[0,'#3b6098'],[1,'#1e3a5f']]};
function ttCard(title,rows){var h='<div class="tt-card"><div class="tt-title">'+title+'</div>';rows.forEach(function(r){h+='<div class="tt-row"><span class="tt-dot" style="background:'+r[0]+'"></span><span class="tt-name">'+r[1]+'</span><span class="tt-val">'+r[2]+'</span></div>';});return h+'</div>';}

function money2(x){return sym()+fmt(x);}
var cmpMode='total';
function renderCmp(){var w=D.weeks,t=tr();
  function gv(i,key){var v=(key==='tickets')?w[i].tickets:V(w[i],key);return cmpMode==='avg'?v/w[i].days:v;}
  function pct(c,p){if(p===0)return null;return (c-p)/Math.abs(p)*100;}
  var cats=[],sk=[],sr=[],sp=[];
  w.forEach(function(x,i){cats.push(x.w);if(i===0){sk.push(null);sr.push(null);sp.push(null);}else{sk.push(pct(gv(i,'tickets'),gv(i-1,'tickets')));sr.push(pct(gv(i,'receipt'),gv(i-1,'receipt')));sp.push(pct(gv(i,'profit'),gv(i-1,'profit')));}});
  function pts(a){return a.map(function(v){return {y:v,color:v==null?'#cbd5e1':(v>=0?'#12b886':'#ef4444')};});}
  Highcharts.chart('c-cmp',Highcharts.merge(base,{chart:{type:'column',spacingTop:16},xAxis:{categories:cats},
    yAxis:{title:{text:t.yPct},labels:{format:'{value}%'},plotLines:[{value:0,color:'#cbd5e1',width:1.5,zIndex:3}]},
    tooltip:{useHTML:true,shared:true,borderWidth:0,backgroundColor:'rgba(0,0,0,0)',shadow:false,padding:0,formatter:function(){var m={};this.points.forEach(function(p){m[p.series.name]=p.y;});function r(n){var v=m[n];if(v==null)return ['#cbd5e1',n,t.baseWeek];var c=v>=0?'#12b886':'#ef4444';return [c,n,(v>=0?'+':'')+fmt1(v)+'%'];}return ttCard(this.x+' · '+(cmpMode==='avg'?t.cmpAvg:t.cmpTotal),[r(t.ttTicket),r(t.ttReceipt),r(t.ttProfit)]);}},
    plotOptions:{column:{borderRadius:4,groupPadding:0.14,dataLabels:{enabled:true,formatter:function(){return this.y==null?'':(this.y>=0?'+':'')+fmt1(this.y)+'%';},style:{fontSize:'9px',fontWeight:'600',textOutline:'none',color:'#5b6b85'}}}},legend:{enabled:true},
    series:[{name:t.ttTicket,data:pts(sk),color:'#12b886'},{name:t.ttReceipt,data:pts(sr),color:'#12b886'},{name:t.ttProfit,data:pts(sp),color:'#12b886'}]}));
}

function renderPL(){var ar=D.ar,t=tr();if(!ar)return;
  function money2(v){return sym()+fmt(CUR==='SGD'?(v/(D.meta.rate)):v);}  // v为CNY, SGD时/汇率
  function plTable(id,items,nameKey,isAir){
    // 盈利TOP + 亏损全部
    var prof=items.filter(function(x){return x.profit>0;}).slice(0,6);
    var loss=items.filter(function(x){return x.profit<0;}).sort(function(a,b){return a.profit-b.profit;}).slice(0,6);
    function amt(v){return sym()+fmt(CUR==='SGD'?v/D.meta.rate:v);}
    function row(x,cls){var nm=isAir?x.name:x.name;var ptCell=(x.tickets>0)?('<td class="'+(x.per_ticket<0?'neg':'pos')+'">'+amt(x.per_ticket)+'</td>'):('<td style="color:#94a3b8">—</td>');var tip='';if(!isAir&&D.routeAir&&D.routeAir[x.name]&&D.routeAir[x.name].length){nm+=' <span style="color:#94a3b8;font-weight:500;font-size:11px">('+D.routeAir[x.name].join('/')+')'+String.fromCharCode(60)+'/span>';}else{tip=' style="font-weight:600;color:#152237"';}return '<tr><td style="font-weight:600;color:#152237">'+nm+'</td><td>'+fmt(x.tickets)+'</td><td class="'+(x.profit<0?'neg':'pos')+'">'+amt(x.profit)+'</td>'+ptCell+'</tr>';}
    var h='<thead><tr><th>'+(isAir?'航司':'航线')+'</th><th>票量</th><th>利润('+sym()+')</th><th>单票利润</th></tr></thead><tbody>';
    h+='<tr><td colspan="4" style="background:#e9f9f2;color:#0f9d6e;font-weight:700;text-align:left;font-family:var(--font)">▲ 盈利'+(isAir?'航司':'航线')+' TOP'+prof.length+'</td></tr>';
    prof.forEach(function(x){h+=row(x);});
    h+='<tr><td colspan="4" style="background:#fdeeee;color:#dc3545;font-weight:700;text-align:left;font-family:var(--font)">▼ 亏损'+(isAir?'航司':'航线')+' TOP'+loss.length+'</td></tr>';
    loss.forEach(function(x){h+=row(x);});
    document.getElementById(id).innerHTML=h+'</tbody>';
  }
  plTable('airPL',ar.airProfit.concat(ar.airLoss),'name',true);
  plTable('routePL',ar.routeProfit.concat(ar.routeLoss),'name',false);
}
function rating(m){var t=tr();if(m>=3)return [t.rExcellent,'a'];if(m>=1.5)return [t.rGood,'b'];return [t.rFair,'c'];}
function renderTable(){var t=tr();var rows=[];
  D.airlines.slice(0,5).forEach(function(x){rows.push(['air',x]);});
  D.routes.slice(0,5).forEach(function(x){rows.push(['route',x]);});
  D.channels.slice(0,4).forEach(function(x){rows.push(['chan',x]);});
  var TL={air:t.typeAir,route:t.typeRoute,chan:t.typeChan};
  var h='<thead><tr><th>'+t.colType+'</th><th>'+t.colName+'</th><th>'+t.colRcpt+'('+sym()+')</th><th>'+t.colProf+'('+sym()+')</th><th>'+t.colTk+'</th><th>'+t.colMargin+'</th><th>'+t.colRate+'</th></tr></thead><tbody>';
  rows.forEach(function(r){var o=r[1];var m=o.profit/o.receipt*100;var rt=rating(m);var name=(r[0]==='route')?o.name:nm(o);h+='<tr><td><span class="tag '+r[0]+'">'+TL[r[0]]+'</span></td><td style="font-weight:600;color:#152237">'+name+'</td><td>'+money(o,'receipt')+'</td><td style="color:'+(o.profit<0?'#ef4444':'#12b886')+'">'+money(o,'profit')+'</td><td>'+fmt(o.tickets)+'</td><td>'+fmt1(m)+'%</td><td><span class="rate '+rt[1]+'">'+rt[0]+'</span></td></tr>';});
