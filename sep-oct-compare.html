function base(){return {chart:{backgroundColor:'transparent',animation:false,style:{fontFamily:'inherit'}},title:null,credits:{enabled:false},
 plotOptions:{series:{animation:false}},legend:{itemStyle:{color:'#5b6b85',fontWeight:'600'}},
 tooltip:{shared:true,backgroundColor:'#fff',borderColor:'#e2e8f0'}};}
function render(){
 var t=T[L],s=A.sep.kpi,o=A.oct.kpi;document.documentElement.lang=L;
 g('title').textContent=t.title;g('sub').textContent=t.sub;g('rate').innerHTML='✅ '+t.rate;
 ['tIns','dIns','tWk','dWk','tCum','dCum','tAir','dAir','tAirT','dAirT','tCh','dCh','tSeg','dSeg','foot'].forEach(function(k){g(k).textContent=t[k];});
 document.querySelectorAll('#curSeg button').forEach(function(b){b.classList.toggle('active',b.dataset.c===CUR);});
 document.querySelectorAll('#langSeg button').forEach(function(b){b.classList.toggle('active',b.dataset.l===L);});
 var items=[[s.tickets,o.tickets,f0,'#5083fb',0],[s.orders,o.orders,f0,'#8b5cf6',0],
  [R({rc:s.receipt_cny,rs:s.receipt_sgd}),R({rc:o.receipt_cny,rs:o.receipt_sgd}),function(v){return sym()+f0(v);},'#0ea5e9',0],
  [P({pc:s.profit_cny,ps:s.profit_sgd}),P({pc:o.profit_cny,ps:o.profit_sgd}),function(v){return sym()+f0(v);},'#12b886',0],
  [s.margin,o.margin,function(v){return v.toFixed(2)+'%';},'#f59e0b','pp'],[s.loss_pct,o.loss_pct,function(v){return v.toFixed(1)+'%';},'#ef4444','ppr'],
  [CUR==='SGD'?s.avg_ticket_profit_sgd:s.avg_ticket_profit,CUR==='SGD'?o.avg_ticket_profit_sgd:o.avg_ticket_profit,function(v){return sym()+f0(v);},'#14b8a6',0],
  [s.loss_orders,o.loss_orders,f0,'#f97316','r']];
 g('kpis').innerHTML=items.map(function(x,i){var d=dl(x[0],x[1],x[4]==='pp'||x[4]==='ppr'?'pp':0);var good=(x[4]==='ppr'||x[4]==='r')?!d[1]:d[1];
  return '<div class="kpi" style="--c:'+x[3]+'"><div class="l">'+t.k[i]+'</div><div class="row"><span class="m">'+t.sep+'</span><span class="v">'+x[2](x[0])+'</span></div><div class="row"><span class="m">'+t.oct+'</span><span class="v o">'+x[2](x[1])+'</span></div><div class="d '+(good?'up':'dn')+'">'+(d[1]?'▲ ':'▼ ')+d[0]+'</div></div>';}).join('');
 g('ins').innerHTML=A.ins[L].map(function(x){return '<div><div class="t">'+x[0]+'</div><div class="x">'+x[1]+'</div></div>';}).join('');
 // weekly
 var wk=['W1','W2','W3','W4','W5'];
 function wv(m,f){return wk.map(function(w){var x=A[m].weeks.filter(function(y){return y.w===w;})[0];return x?f(x):null;});}
 Highcharts.chart('cWk',Highcharts.merge(base(),{xAxis:{categories:wk.map(function(w,i){var a=A.sep.weeks[i],b=A.oct.weeks[i];return w+'<br><span style="font-size:10px;color:#94a3b8">'+(a?a.range:'')+' / '+(b?b.range:'')+'</span>';})},
  yAxis:[{title:{text:t.prof+' ('+sym()+')'}},{title:{text:t.tick},opposite:true}],
  series:[{type:'column',name:t.sep+' '+t.prof,data:wv('sep',P),color:CS,borderRadius:4},{type:'column',name:t.oct+' '+t.prof,data:wv('oct',P),color:CO,borderRadius:4},
   {type:'spline',name:t.sep+' '+t.tick,yAxis:1,data:wv('sep',function(x){return x.t;}),color:'#cbd5e1',dashStyle:'ShortDash'},{type:'spline',name:t.oct+' '+t.tick,yAxis:1,data:wv('oct',function(x){return x.t;}),color:'#f59e0b'}]}));
 // cumulative
 function cum(m){var c=0,r=[];for(var d=1;d<=31;d++){var x=A[m].daily.filter(function(y){return y.d===d;})[0];if(!x){r.push(m==='sep'&&d>30?null:(r.length?r[r.length-1]:0));continue;}c+=P(x);r.push(Math.round(c));}return r;}
 var days=[];for(var d=1;d<=31;d++)days.push(d);
 Highcharts.chart('cCum',Highcharts.merge(base(),{chart:{type:'areaspline'},xAxis:{categories:days,title:{text:t.day}},yAxis:{title:{text:sym()}},
  plotOptions:{areaspline:{fillOpacity:.12,marker:{enabled:false}}},series:[{name:t.sep,data:cum('sep'),color:CS},{name:t.oct,data:cum('oct'),color:CO}]}));
 // airlines
 var air=A.air;
 Highcharts.chart('cAir',Highcharts.merge(base(),{chart:{type:'bar'},xAxis:{categories:air.map(function(r){return r.name;})},yAxis:{title:{text:t.prof+' ('+sym()+')'}},
  plotOptions:{bar:{borderRadius:3,groupPadding:.12}},series:[{name:t.sep,data:air.map(function(r){return P(r.sep);}),color:CS},{name:t.oct,data:air.map(function(r){return P(r.oct);}),color:CO}]}));
 var srt=air.slice().sort(function(a,b){return (P(b.oct)-P(b.sep))-(P(a.oct)-P(a.sep));});
 g('airTbl').innerHTML='<table><thead><tr><th>'+t.air+'</th><th>'+t.sep+'</th><th>'+t.oct+'</th><th>'+t.chg+'</th></tr></thead><tbody>'+srt.map(function(r){var c=P(r.oct)-P(r.sep);return '<tr><td>'+r.name+'</td><td>'+sym()+f0(P(r.sep))+'</td><td>'+sym()+f0(P(r.oct))+'</td><td class="'+(c>=0?'up':'dn')+'">'+(c>=0?'+':'-')+sym()+f0(Math.abs(c))+'</td></tr>';}).join('')+'</tbody></table>';
 // channels
 var ch=A.ch;
 Highcharts.chart('cCh',Highcharts.merge(base(),{chart:{type:'column'},xAxis:{categories:ch.map(function(r){return nm(r.name);}),labels:{style:{fontSize:'10px'}}},yAxis:{title:{text:t.prof+' ('+sym()+')'}},
  plotOptions:{column:{borderRadius:3}},series:[{name:t.sep,data:ch.map(function(r){return P(r.sep);}),color:CS},{name:t.oct,data:ch.map(function(r){return P(r.oct);}),color:CO}]}));
 // seg
 Highcharts.chart('cSeg',Highcharts.merge(base(),{chart:{type:'column'},xAxis:{categories:[t.sep,t.oct]},yAxis:{title:{text:sym()}},
  plotOptions:{column:{stacking:'normal',borderRadius:3,dataLabels:{enabled:true,formatter:function(){return sym()+f0(this.y);},style:{fontSize:'10px',textOutline:'none'}}}},
  series:[{name:t.pre,data:[P(A.sep.seg.presale),P(A.oct.seg.presale)],color:'#5083fb'},{name:t.aft,data:[P(A.sep.seg.afterNet),P(A.oct.seg.afterNet)],color:'#12b886'}]}));
}
document.querySelectorAll('#curSeg button').forEach(function(b){b.onclick=function(){CUR=b.dataset.c;render();};});
document.querySelectorAll('#langSeg button').forEach(function(b){b.onclick=function(){L=b.dataset.l;CUR=L==='en'?'SGD':'CNY';render();};});
window.addEventListener('message',function(e){if(e.data&&e.data.lang){var nl=e.data.lang==='en'?'en':'zh';L=nl;CUR=nl==='en'?'SGD':'CNY';render();}});
(function(){try{if(window.self!==window.top)document.body.classList.add('in-iframe');}catch(e){document.body.classList.add('in-iframe');}})();
render();
</script></body></html>
